<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · TripSplit</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f9fafb; color: #111827; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #6b7280; margin: 0 0 20px; }
  button { background: #1a56db; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } p { color: #94a3b8; } }
</style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>Open TripSplit once with signal and it will work offline next time.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
